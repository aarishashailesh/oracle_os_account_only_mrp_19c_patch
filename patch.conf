#!/usr/bin/env bash
# =============================================================================
# patch.conf : central configuration for the 19.33 MRP cycle
# Setup: single node CRS, ONE OS owner (oracle owns Grid and the database)
# Companion of: github.com/aarishashailesh/oracle_os_account_only_automation_oop_patch (in place MRP, no new homes)
#
# MRP patches are applied IN PLACE on the existing 19.33 homes. Nothing is
# hardcoded in the scripts; edit this file only. Passwords are never stored.
# =============================================================================

# -----------------------------------------------------------------------------
# PATCH IDENTITY (from the two README files, MRP 19.33.0.0.261117)
# -----------------------------------------------------------------------------
MRP_LABEL="19.33.0.0.261117"

GI_MRP_PATCH="40196150"                                   # GI MRP  (Grid home, optionally DB home)
GI_MRP_ZIP="p40196150_1933000DBRU_Linux-x86-64.zip"
DB_MRP_PATCH="40196156"                                   # DB MRP  (DB home)
DB_MRP_ZIP="p40196156_1933000DBRU_Linux-x86-64.zip"

# Required RU level of the homes BEFORE the MRP, matched against `opatch lspatches`.
# NOTE: the DB MRP readme requires RU 19.33.0.0.261020. The GI MRP readme says
# 19.32.0.0.260721, which looks like a stale text (GI MRP 19.33 and the DB MRP carry the
# same fixes). Homes at 19.33 pass this check. Set ALLOW_RU_MISMATCH=yes only after
# confirming with Oracle Support.
BASE_RU_REGEX="19\.33\.0\.0"
ALLOW_RU_MISMATCH="no"

# Patch ids that must show in `opatch lspatches` after patching (from "Bugs Fixed").
# DB home : DB MRP 40127726, 40180925, 40096495, 33566299, 40130806
# Grid home: GI MRP 40127726, 40180925, 40096495 and OCWRU MLR 40258656. The Grid home only
#            receives the subset that applies to it, so only the MLR is listed, as a warning.
# Leave DB_HOME_EXPECTED_IDS empty to use the sub-patch ids found in the extracted MRP.
DB_HOME_EXPECTED_IDS="40127726,40180925,40096495,33566299,40130806"
GRID_HOME_EXPECTED_IDS="40258656"
GRID_VERIFY_STRICT="no"          # yes = missing Grid ids fail phase 3 instead of warning

# How the DB home gets the MRP:
#   DB_MRP : opatch napply of DB MRP 40196156 (recommended offline method in its readme)
#   GI_MRP : opatchauto apply -binary of GI MRP 40196150 (Case 2 of the GI readme)
# Do not use both on the same home: the two MRPs carry the same fixes.
DB_PATCH_METHOD="DB_MRP"

# OPatch: both readmes need 12.2.0.1.52 or later.
OPATCH_PATCH="6880880"
OPATCH_ZIP="p${OPATCH_PATCH}_190000_Linux-x86-64.zip"
MIN_OPATCH_VERSION="12.2.0.1.52"
UPDATE_OPATCH="auto"             # auto = only when older than the minimum, yes = always, no = never

# -----------------------------------------------------------------------------
# HOMES AND OS USERS (the homes that are patched in place; no trailing slash)
# -----------------------------------------------------------------------------
GRID_HOME="/u01/app/19.33.0.0/grid"
DB_HOME="/u01/app/oracle/product/19.0.0/dbhome_1933"

GRID_USER="oracle"                 # ONE account owns Grid Infrastructure and the database
ORACLE_USER="oracle"               # (DB env comes from . oraenv, Grid variables from .bashrc: the scripts set
                                   # ORACLE_HOME / PATH explicitly for every command, so neither leaks)
INSTALL_GROUP="oinstall"
export CV_ASSUME_DISTID="OEL7.8"   # required for installer-based tools on Oracle Linux 8

# CRS database name (srvctl config database). Empty = auto-detect when exactly one exists.
DB_NAME="proddb"
DB_SID=""                          # empty = detected from srvctl status

# -----------------------------------------------------------------------------
# STAGING, LOGS, BACKUP
# -----------------------------------------------------------------------------
PATCH_LOC="/u01/patching/patches_mrp"          # the two MRP zips and the OPatch zip go here
LOG_DIR="${PATCH_LOC}/logs"
BACKUP_DIR="${PATCH_LOC}/backup"
BACKUP_HOMES="yes"                 # tar.gz of both homes and the inventory before patching
MIN_FREE_GB_STAGING=5
MIN_FREE_GB_HOMES=10               # free space per home file system for the patch

# -----------------------------------------------------------------------------
# DATABASE OPTIONS AND TRIGGER
# -----------------------------------------------------------------------------
# In-place patching relinks the binaries. Phase 3 checks that the options listed here are
# still disabled in v$option and, with CHOPT_REAPPLY=yes, runs chopt again (one DB restart).
# Allowed: olap rat partitioning ("partitioning" is never touched on a CDB). Empty = no check.
CHOPT_DISABLE="olap rat partitioning"
CHOPT_REAPPLY="yes"
PARTITIONING_REQUIRED="no"   # yes = phase 3 fails if v$option Partitioning is not TRUE

# SYS.DB_DDL_ALERT_TRG is disabled before the outage and enabled after datapatch (skipped if absent).
DDL_TRIGGER_HANDLING="yes"

CRS_WAIT_SECONDS=900               # wait for the CRS stack after opatchauto

# -----------------------------------------------------------------------------
# DERIVED : do not edit
# -----------------------------------------------------------------------------
SCRIPTS_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
STATUS_DIR="${LOG_DIR}/.phase_status"
TMP_DIR="${LOG_DIR}/.tmp"
